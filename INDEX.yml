skin_runtime:
  primary:
    - docs/Skin Runtime Findings.md
    - docs/Skin SDK.md
  fixtures:
    - tests/Skins/PlaceholderConditionTest/README.md
    - tests/Skins/PlaceholderConditionTest/skin.xml

plugin_sdk:
  primary:
    - docs/Plugin SDK.md
  note: >-
    C++ native-code extension point, and the boundary where VDJScript results are
    still typed: GetInfo -> double, GetStringInfo -> text, SendCommand -> execute.
    Also the VDJPARAM_* model and the [autoparams] manifest used by all 173
    built-in plugins. Headers are third-party and NOT vendored (no license grant);
    fetch to vendor/, which is gitignored.
  related:
    - docs/HTTP Control Interface.md
    - docs/Undocumented VDJScript Candidates.md

skin_sdk:
  primary:
    - docs/Skin SDK.md
    - docs/Skin Waveforms.md
    - docs/Example Skin XML Objects.md
  findings:
    - docs/Published Skin Findings.md    # idioms from public skins, before they are folded in
    - docs/Sysicon Binary Resolver.md    # how sysicon names resolve on b9598, hidden mappings
    - docs/Historical Installer Excavation.md  # build-stamped compatibility history from older installers
  status:
    - docs/skin-xml-inventory.json
  topic_tags:
    - docs/topic-tags.json               # hand-maintained input to `just topic`
  examples:
    - examples/Skins/ModularSkeleton/README.md
    - examples/Skins/GraveRaver/README.md
  built_in:
    - examples/Skins/Built-In/README.md
  commands:
    - just get-xml-element NAME
    - just list-skin-elements [--family=X --undocumented --has-attr=X]
    - just xml-stats
    - just inventory
    - just lint-skins

application_internals:
  lyrics:
    command: just lyrics-cache --evidence
    inspect: just lyrics-cache --summary --db OFFLINE_EXTRA_DB
    evidence: tests/lyrics-cache-9246.json
    note: AudioSig and 18-byte LID, Chromaprint reduction, timestamped payload grammar; Tier 2.
  linked_tracks:
    list: just list-linked-tracks [--json] [--db PATH]
    command: just linked-sid --evidence
    calculator: just linked-sid --prepared --artist ARTIST --title TITLE --remix REMIX
    evidence: tests/linked-sid-9246.json
    note: Metadata FNV-1 SID; prepared-input calculator does not port tag cleanup.
  primary:
    - docs/Application Internals.md
  related:
    - docs/Resources.md

