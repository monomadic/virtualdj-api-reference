# Routing index for agents and humans.
# Keep volatile coverage counts in docs/Official VDJScript Coverage Audit.md,
# not here.

# Cross-corpus entry point: `just topic <term>` aggregates verbs, effects, XML
# elements, real example files, docs, and quirks for one topic. Start here for
# "how do I do X"; the per-topic sections below are for drilling in.
topic_search:
  primary:
    - tools/topic.py
  commands:
    - just topic sampler
    - just topic colorfx [--format=json --limit=N]

# Evidence policy governs all claims. Read before recording any finding.
evidence:
  primary:
    - docs/Evidence Standards.md
  note: >-
    Three tiers: PROOF = direct observation of the running app (network protocol, HTTP
    interface, live pad tests, agent driving the window). LEADS = staff forums, unbacked
    binary analysis, official example files. Everything else is not recorded. Existence,
    kind, and behavior are separate claims; the binary can DISPROVE a name but cannot
    prove behavior.

tasks:
  queue: TASKS.md
  history: HISTORY.md                  # completed tasks; never selected from
  roadmap: docs/Completeness Roadmap.md
  frozen_plans:                          # design references, not active state
    - docs/VDJScript Reference Consolidation Plan.md
  review_records:
    - docs/Repository Assessment and Prioritized Tasks.md
  commands:
    - just next-task
    - just status

vdjscript:
  primary:
    - docs/VirtualDJ Reference.md
    - docs/VDJScript Verbs.md
  grammar:
    - docs/VDJScript Grammar.md          # read the summary before writing VDJScript
    - docs/VDJScript Syntax Evidence.md  # raw parser/binary evidence behind it
    - docs/Runtime Argument Grammar Tests.md  # H4: the common argument parser as executable predictions
    - tests/Pads/Reference - Grammar Battery Test.xml
  status:
    - docs/Official VDJScript Coverage Audit.md
    - docs/VDJScript Local Test Tracker.md
  candidates:
    - docs/Undocumented VDJScript Candidates.md
  button_editor:                         # category metadata, not behaviour evidence
    - docs/Button Editor Catalog Audit.md
    - docs/Button Editor Taxonomy.md
  machine_index:
    - docs/vdjscript-verb-index.json
  record_store:
    - docs/vdjscript-verbs.json
  arguments:                             # what a verb's TAIL accepts — four sources
    - tests/action-catalog.json          # vendor prose: what a parameter MEANS (816 descriptions)
    - tests/verb-arg-forms.json          # probed: token vs nonsense control, per fixture
    - tests/attested-tails.json          # tails AND argument shapes (arity, token types, return evidence) from shipped scripts
    - tests/binary-vocabularies.json     # shared enumerations as binary structures (tables, switches)
    - tests/verb-execute-forms.json      # execute-position tails, two-baseline signatures
  structural:                            # how the binary-derived tail evidence is bounded
    - docs/Verb Tail Structural Discovery.md
    - tests/action-contracts.json        # per-verb class, capability, helper literal leads
    - tests/action-contracts-debug.json  # the call-graph addresses behind those leads
    - tests/action-tail-leads.json       # ranked Tier-2 tail queue, verb-store joined at query time
  corpus:
    - tests/vdjscript-corpus.json        # vendor-written snippets, with provenance (factory mappings, Built-In XML, catalog, wiki, binary)
    - tests/corpus-parse-results.json    # every snippet through /query, outcomes classified
  commands:
    - just verb NAME                     # everything known about one verb, one screen
    - just get-verb NAME
    - just verb-arg-forms NAME           # probed tail tokens for one verb
    - just action-catalog --get NAME     # the vendor's own description and parameters
    - just action-catalog --cross-check  # catalog vs probe vs corpus, three ways
    - just attested-tails --verb NAME    # tails used in shipped scripts
    - just binary-vocab --get GROUP      # a shared enumeration and its hidden members
    - just binary-vocab --verb NAME      # which enumerations a verb draws from
    - just action-tail-leads --queue     # ranked Tier-2 tail probe queue, settled tails removed
    - just action-tail-leads --get NAME  # one verb's literal leads, helper fan-out labelled
    - just verb-contract NAME            # class, capability, arg demands, helper candidates
    - just verb-traces NAME              # the call-graph addresses behind those candidates
    - just script-corpus --verb NAME     # vendor examples mentioning a verb
    - just list-verbs TERM [--surface=X --section=X --status=X --format=json]
    - just put-verb NAME field=value ...
    - just next-incomplete-verb
    - just verb-stats
    - just grep-verb-docs NAME
    - just needs-test
    - just verb-index
    - just runtime-grammar               # run the H4 argument-grammar predictions live

live_probe:
  primary:
    - docs/HTTP Control Interface.md
  commands:
    - just vdj-up
    - just vdj-query 'SCRIPT'
    - just vdj-execute 'SCRIPT'
    - just verb-probe NAME          # does this name exist, and what kind is it?
    - just binary-verb NAME         # structured binary evidence for one name
    - just sweep-verb-existence     # refresh tests/verb-existence-sweep.json
    - just fixtures                 # named states a probe can establish (10)
    - just probe-arg-forms [--from-catalog|--from-corpus|--lexicon]
    - just probe-execute-forms      # WRITES: allowlisted settings verbs, restored and verified
    - just corpus-parses            # send every vendor snippet through /query

agent_integration:
  primary:
    - docs/MCP Server.md
  note: >-
    Serves the verb store, FX catalog, XML inventory, grammar, linters and the live
    HTTP probe channel to any MCP client over stdio. Zero dependencies.
  commands:
    - just mcp-serve                # serve the query layer to an MCP client over stdio
    - just mcp-check                # smoke-test every tool without a client

remote_protocol:
  primary:
    - docs/Remote Protocol.md
  note: >-
    VirtualDJ Remote companion-app wire protocol (Bonjour _vdjremote8._tcp, port 4243,
    8JDV framing, VDJScript query subscriptions). Separate from the HTTP interface.
  commands:
    - python3 tools/vdjremote_dial.py DEVICE_IP
    - python3 tools/vdjremote_dial.py --decode tests/vdjremote-opener.bin
    - python3 tools/vdjremote_subscribe.py tests/vdjremote-opener.bin 'left:get_title' 'get_clock'

fx:
